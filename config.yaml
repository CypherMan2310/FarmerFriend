# Single source for model names, paths, top_k and languages (CLAUDE.md rule 5).
# Every checkpoint below was checked on Hugging Face on 2026-11-05 (docs/MODEL_CHECK.md).

languages:
  supported: [ta, hi, en]
  pivot: en
  # IndicTrans2 (FLORES-200 style) codes
  indictrans_codes:
    ta: tam_Taml
    hi: hin_Deva
    en: eng_Latn

models:
  llm:
    primary: bharatgenai/AgriParam
    # Plan's third fallback ("any open multilingual instruct model") is not chosen yet;
    # pick and verify one only if both of these fail.
    fallbacks:
      - bharatgenai/Param-1-2.9B-Instruct
    trust_remote_code: true
    dtype: bfloat16
    max_context_tokens: 2048   # max_position_embeddings in the checkpoint's config.json
    max_new_tokens: 300
  translation:
    # First backend that loads wins. IndicTrans2 is gated on Hugging Face; NLLB-200 is the
    # non-gated fallback (verified 2026-11-05, licence CC-BY-NC-4.0, non-commercial use).
    backend_order: [indictrans2, nllb]
    indic_en: ai4bharat/indictrans2-indic-en-dist-200M
    en_indic: ai4bharat/indictrans2-en-indic-dist-200M
    fallbacks:
      indic_en: ai4bharat/indictrans2-indic-en-1B
      en_indic: ai4bharat/indictrans2-en-indic-1B
    nllb: facebook/nllb-200-distilled-600M
    device: cuda
    dtype: float16
    batch_size: 8
    num_beams: 4
    max_length: 256
  embedding:
    primary: BAAI/bge-m3
    fallbacks:
      - intfloat/multilingual-e5-base

retrieval:
  top_k: 5
  candidate_k: 30        # per retriever, before reciprocal-rank fusion
  rrf_k: 60
  collection: chunks
  embed_batch_size: 32
  index_device: cuda     # bulk indexing
  query_device: cpu      # keeps GPU memory for the LLM and translator at answer time

router:
  # Calibrated on in-domain vs out-of-domain queries (eval/report.md).
  ood_min_sim: 0.35          # no farming keyword, or best dense cosine below this -> refuse
  answer_min_sim: 0.40       # below this the LLM is not called -> no-source fallback

chunking:
  # Counted with the answer LLM's tokenizer (models.llm.primary). 300 is the plan's lower
  # bound: 5 x 300 + prompt + 300 new tokens stays inside AgriParam's 2048-token window.
  max_tokens: 300
  overlap_tokens: 40
  min_tokens: 80        # a shorter final chunk is merged into the previous one if it fits

paths:
  raw_dir: data/raw
  sources: data/SOURCES.md
  source_manifest: data/sources.jsonl
  extracted: data/extracted.jsonl
  chunks: data/chunks.jsonl
  index_dir: data/index
  feedback_log: logs/feedback.jsonl
  eval_cases: eval/cases.jsonl
  eval_report: eval/report.md
